<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#23262b">
<title>Сигнали</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap&subset=cyrillic" rel="stylesheet">
<style>
  /* Trista: графит, оранжево, злато. Категориите са валидирана последователност (CVD) — ред: доставки, наличности, чеклист, свършили, снимки, обходи. */
  :root {
    color-scheme: light;
    --bg: #eef0f2; --surface: #ffffff; --ink: #1d2024; --ink-2: #4a4f57; --ink-3: #7a8089; --line: #dde1e6;
    --graphite: #23262b; --graphite-2: #31353c; --on-graphite: #f3f1ec; --on-graphite-2: #b9bcc2;
    --orange: #e8692c; --gold: #c9a227;
    --c-dostavki: #2a78d6; --c-nalichnost: #eb6834; --c-cheklist: #1baf7a;
    --c-svarshili: #6250d6; --c-snimki: #e87ba4; --c-obhodi: #008300; --c-drugi: #8a8f97;
    --crit: #d03b3b; --crit-bg: #fde8e8; --warn: #b07800; --warn-bg: #fff4d6; --good: #0a8a0a; --good-bg: #e6f6e6;
    --low-bg: #eceef1;
    --r: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --bg: #141517; --surface: #1d1f22; --ink: #eceae6; --ink-2: #c3c2bd; --ink-3: #8f9198; --line: #2e3136;
      --graphite: #0d0e10; --graphite-2: #1f2226;
      --c-dostavki: #3987e5; --c-nalichnost: #d95926; --c-cheklist: #199e70;
      --c-svarshili: #9085e9; --c-snimki: #d55181; --c-obhodi: #2f9a2f;
      --crit: #ec6a6a; --crit-bg: #3a1a1a; --warn: #fab219; --warn-bg: #372b10; --good: #4fc14f; --good-bg: #16301a;
      --low-bg: #26282c;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font: 15px/1.5 Onest, system-ui, sans-serif; background: var(--bg); color: var(--ink); padding-bottom: 76px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
  .num { font-family: Unbounded, Onest, sans-serif; font-variant-numeric: tabular-nums; letter-spacing: .02em; word-spacing: .12em; }
  main { max-width: 820px; margin: 0 auto; padding: 0 16px; }

  /* ---------- графитена лента ---------- */
  .hero { background: var(--graphite); color: var(--on-graphite); padding: 18px 16px 20px; }
  .hero-in { max-width: 820px; margin: 0 auto; }
  .hero .when { color: var(--on-graphite-2); font-size: 13px; display: flex; justify-content: space-between; gap: 8px; }
  .hero h1 { font-weight: 500; font-size: 18px; line-height: 1.45; margin: 10px 0 16px; max-width: 60ch; }
  .hero h1.title { font-family: Unbounded, sans-serif; font-weight: 500; font-size: 22px; letter-spacing: .01em; }
  .seg { display: flex; height: 14px; gap: 2px; border-radius: 7px; overflow: hidden; background: var(--graphite-2); }
  .seg > button { border: 0; padding: 0; height: 100%; cursor: pointer; transform-origin: left; flex-basis: 0;
    transition: flex-grow .9s cubic-bezier(.2,.8,.2,1), opacity .2s; }
  .seg > button:hover { opacity: .8; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 13px; color: var(--on-graphite-2); }
  .legend button { background: none; border: 0; padding: 2px 0; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: inherit; }
  .legend b { color: var(--on-graphite); font-weight: 600; }
  .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block; }

  /* ---------- числа ---------- */
  .kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: -14px 0 6px; position: relative; }
  @media (min-width: 640px) { .kpis { grid-template-columns: repeat(4, 1fr); } }
  .kpi { background: var(--surface); border-radius: var(--r); padding: 12px 14px; box-shadow: 0 1px 0 var(--line); }
  .kpi .v { font-size: 24px; font-weight: 500; line-height: 1.15; }
  .kpi .l { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
  .kpi .d { font-size: 12px; margin-top: 4px; color: var(--ink-3); }
  .kpi .d.up { color: var(--crit); } .kpi .d.down { color: var(--good); }
  .kpi.crit .v:not([data-to="0"]) { color: var(--crit); }

  /* ---------- раздели ---------- */
  h2 { font-size: 17px; margin: 26px 0 10px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
  h2 small { font-weight: 400; color: var(--ink-3); font-size: 13px; }

  /* ---------- карти от доклада ---------- */
  .acard { background: var(--surface); border-radius: var(--r); margin: 10px 0; overflow: hidden; position: relative;
    border-left: 6px solid var(--cat, var(--c-drugi)); }
  .acard .top { padding: 12px 14px 4px; display: flex; gap: 10px; align-items: flex-start; }
  .acard .rank { font-family: Unbounded, sans-serif; font-size: 13px; color: var(--ink-3); padding-top: 3px; min-width: 18px; }
  .acard h3 { margin: 0; font-size: 16px; line-height: 1.3; flex: 1; }
  .eur { font-family: Unbounded, sans-serif; font-weight: 500; font-size: 15px; letter-spacing: .02em; word-spacing: .1em; white-space: nowrap; color: var(--ink); }
  .eur small { font-family: Onest; font-weight: 500; font-size: 12px; color: var(--ink-3); }
  .acard .body { padding: 0 14px 12px 42px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 8px; }
  .chip { font-size: 12.5px; padding: 3px 9px; border-radius: 99px; background: var(--low-bg); color: var(--ink); border: 0; cursor: pointer; }
  .chip.cat { color: #fff; background: var(--cat); cursor: default; }
  .facts { margin: 4px 0 8px; padding: 0; list-style: none; }
  .facts li { position: relative; padding: 3px 0 3px 16px; font-size: 14px; }
  .facts li::before { content: ''; position: absolute; left: 2px; top: 11px; width: 6px; height: 6px; border-radius: 2px; background: var(--cat); }
  .line { display: grid; grid-template-columns: 74px 1fr; gap: 8px; font-size: 14px; padding: 5px 0; border-top: 1px solid var(--line); }
  .line > span:first-child { color: var(--ink-3); }
  .line.act > span:last-child { font-weight: 600; }
  .rule { margin-top: 8px; background: var(--low-bg); border-radius: 10px; padding: 8px 10px; font-size: 14px; }
  .rule b { display: block; font-size: 12.5px; color: var(--ink-2); font-weight: 600; margin-bottom: 2px; }
  .more { margin-top: 8px; background: none; border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .sub-list { margin-top: 8px; }

  /* ---------- проблем от дневника ---------- */
  .prob { background: var(--surface); border-radius: 12px; margin: 8px 0; border-left: 4px solid var(--cat, var(--c-drugi)); }
  .prob > summary { list-style: none; cursor: pointer; padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
  .prob > summary::-webkit-details-marker { display: none; }
  .prob .st { font-weight: 600; font-size: 14px; }
  .prob .tt { font-size: 14px; color: var(--ink-2); grid-column: 1 / 2; }
  .prob .meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; grid-column: 1 / -1; margin-top: 4px; }
  .prob .pv { font-size: 13.5px; font-weight: 700; text-align: right; }
  .prob[open] > summary { border-bottom: 1px solid var(--line); }
  .prob .in { padding: 10px 12px 12px; animation: open .25s ease-out; }
  @keyframes open { from { opacity: 0; transform: translateY(-4px); } }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 99px; display: inline-flex; align-items: center; gap: 4px; background: var(--low-bg); color: var(--ink-2); }
  .badge.висок { background: var(--crit-bg); color: var(--crit); font-weight: 600; }
  .badge.среден { background: var(--warn-bg); color: var(--warn); }
  .badge.new { background: var(--graphite); color: var(--on-graphite); }
  .badge.ok { background: var(--good-bg); color: var(--good); }
  table.items { width: 100%; border-collapse: collapse; font-size: 13.5px; margin: 4px 0 10px; }
  table.items td { padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.items td.r { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  table.items .inf { color: var(--ink-3); font-size: 12.5px; }
  .dup { color: var(--crit); font-weight: 700; font-size: 11.5px; }
  .streak { display: inline-flex; gap: 2px; vertical-align: middle; }
  .streak i { width: 6px; height: 12px; border-radius: 2px; background: var(--crit); display: inline-block; opacity: .85; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
  select, input, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; width: 100%; }
  textarea { min-height: 56px; }
  .btn { background: var(--graphite); color: var(--on-graphite); border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 600; cursor: pointer; }
  .btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
  .hist { font-size: 12px; color: var(--ink-3); margin: 2px 0; }

  /* ---------- графики ---------- */
  .panel { background: var(--surface); border-radius: var(--r); padding: 14px; }
  .bars .b { display: grid; grid-template-columns: minmax(90px, 32%) 1fr auto; gap: 10px; align-items: center; padding: 5px 0; cursor: pointer; border: 0; background: none; width: 100%; text-align: left; }
  .bars .b:hover .nm { text-decoration: underline; }
  .bars .nm { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bars .track { display: flex; gap: 2px; height: 12px; }
  .bars .track span { height: 100%; border-radius: 0; transform-origin: left; animation: grow .8s cubic-bezier(.2,.8,.2,1) both; }
  .bars .track span:first-child { border-top-left-radius: 2px; border-bottom-left-radius: 2px; }
  .bars .track span:last-child { border-top-right-radius: 4px; border-bottom-right-radius: 4px; }
  .bars .val { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--ink-2); min-width: 54px; text-align: right; }
  .bars .val b { color: var(--crit); }
  @keyframes grow { from { transform: scaleX(0); } }
  .chart-wrap { position: relative; }
  .tip { position: absolute; pointer-events: none; background: var(--graphite); color: var(--on-graphite); font-size: 12.5px; padding: 6px 9px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -110%); opacity: 0; transition: opacity .12s; }
  .ser { display: flex; gap: 14px; font-size: 12.5px; color: var(--ink-2); margin-bottom: 6px; }
  .ser span { display: inline-flex; align-items: center; gap: 6px; }
  .ser i { width: 14px; height: 2px; display: inline-block; border-radius: 2px; }

  /* ---------- навигация и общи ---------- */
  nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 10; }
  nav button { flex: 1; border: 0; background: none; color: var(--ink-3); padding: 10px 2px 11px; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; }
  nav button svg { width: 20px; height: 20px; }
  nav button.on { color: var(--ink); font-weight: 600; }
  nav button.on svg { color: var(--orange); }
  .filters { display: flex; gap: 6px; overflow-x: auto; padding: 12px 0 4px; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .filters button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .filters button.on { background: var(--graphite); color: var(--on-graphite); border-color: var(--graphite); }
  .search { margin: 6px 0; }
  .muted { color: var(--ink-3); }
  .err { color: var(--crit); font-size: 13px; background: var(--crit-bg); padding: 8px 10px; border-radius: 10px; margin-top: 10px; }
  .empty { text-align: center; color: var(--ink-3); padding: 30px 10px; }
  .hide { display: none !important; }
  .back { background: none; border: 0; color: var(--on-graphite-2); padding: 0; font-size: 13px; cursor: pointer; }
  .wait { background: var(--surface); border-radius: var(--r); padding: 12px 14px; color: var(--ink-2); font-size: 14px; }
  #login { min-height: 100vh; display: grid; place-items: center; background: var(--graphite); color: var(--on-graphite); padding: 16px; }
  #login form { width: 100%; max-width: 320px; }
  #login input { background: var(--graphite-2); border-color: #444; color: var(--on-graphite); margin: 14px 0 10px; }
  #login .btn { width: 100%; background: var(--orange); color: #fff; }
  .loading { height: 3px; background: linear-gradient(90deg, transparent, var(--orange), transparent); background-size: 200% 100%; animation: ld 1.2s linear infinite; position: fixed; top: 0; left: 0; right: 0; z-index: 20; }
  @keyframes ld { to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="loading" class="loading hide"></div>

<div id="login" class="hide">
  <form onsubmit="login(event)">
    <div class="num" style="font-size:26px;font-weight:700">Сигнали</div>
    <div style="color:var(--on-graphite-2);font-size:14px">Проблемите от Обход и Мин Макс</div>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Парола" aria-label="Парола">
    <button class="btn" type="submit">Влез</button>
    <p id="loginErr" style="color:#ff9b8a;font-size:13px"></p>
  </form>
</div>

<div id="app" class="hide">
  <div id="view"></div>
  <nav aria-label="Раздели">
    <button data-v="report"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>Доклад</button>
    <button data-v="stores"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9M3 9h18v11H3zM9 20v-6h6v6"/></svg>Обекти</button>
    <button data-v="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Дневник</button>
    <button data-v="owners"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 11a3 3 0 100-6M22 21c0-3-2-5-4-5.5"/></svg>Хора</button>
    <button data-v="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3v18h18M7 15l4-4 3 3 6-7"/></svg>Правила</button>
  </nav>
</div>

<script>
/* ============ общи ============ */
const CAT = {
  dostavki:   { l: 'Доставки',   c: 'var(--c-dostavki)' },
  nalichnost: { l: 'Наличности', c: 'var(--c-nalichnost)' },
  cheklist:   { l: 'Чеклист',    c: 'var(--c-cheklist)' },
  svarshili:  { l: 'Свършили',   c: 'var(--c-svarshili)' },
  snimki:     { l: 'Снимки',     c: 'var(--c-snimki)' },
  obhodi:     { l: 'Обходи',     c: 'var(--c-obhodi)' },
  drugi:      { l: 'Други',      c: 'var(--c-drugi)' }
};
const CAT_ORDER = ['dostavki', 'nalichnost', 'cheklist', 'svarshili', 'snimki', 'obhodi', 'drugi'];
const STATUSES = ['ново', 'възложено', 'в работа', 'решено', 'игнорирай', 'изчезна'];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const eurF = (v, d = 0) => v == null || isNaN(v) ? '–' : Number(v).toLocaleString('bg-BG', { minimumFractionDigits: d, maximumFractionDigits: d }) + ' €';
const d2 = d => d ? new Date(d).toLocaleDateString('bg-BG', { day: '2-digit', month: '2-digit' }) : '';
const dt = d => d ? new Date(d).toLocaleString('bg-BG', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
const isoBg = iso => iso ? iso.split('-').reverse().join('.') : '';
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let owners = [], state = { view: 'report', store: null, logCat: '', logStatus: 'open', logQ: '' };

async function api(path, opts = {}) {
  $('#loading').classList.remove('hide');
  try {
    const r = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) } });
    if (r.status === 401) { $('#app').classList.add('hide'); $('#login').classList.remove('hide'); throw new Error('вход'); }
    return await r.json();
  } finally { $('#loading').classList.add('hide'); }
}
async function login(e) {
  e.preventDefault();
  const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: $('#pw').value }) });
  if (!r.ok) { $('#loginErr').textContent = 'Грешна парола'; return; }
  $('#login').classList.add('hide'); start();
}
function countUp(el) {
  const to = parseFloat(el.dataset.to || '0'), dec = parseInt(el.dataset.dec || '0', 10), suf = el.dataset.suf || '';
  const fmt = v => v.toLocaleString('bg-BG', { minimumFractionDigits: dec, maximumFractionDigits: dec }) + suf;
  if (reduced) { el.textContent = fmt(to); return; }
  const t0 = performance.now(), dur = 900;
  const step = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(to * e); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function go(view, extra = {}) {
  Object.assign(state, { view }, extra);
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === (view === 'store' ? 'stores' : view)));
  ({ report: viewReport, stores: viewStores, store: viewStore, log: viewLog, owners: viewOwners, stats: viewStats })[view]();
  window.scrollTo(0, 0);
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => go(b.dataset.v));

/* ============ общи парчета ============ */
function segBar(byCat, onClickAttr = 'filterCat') {
  const total = CAT_ORDER.reduce((s, k) => s + (byCat[k] || 0), 0) || 1;
  const segs = CAT_ORDER.filter(k => byCat[k]).map(k =>
    `<button style="background:${CAT[k].c};flex-grow:0" data-g="${byCat[k] / total}" title="${CAT[k].l}: ${byCat[k]}" aria-label="${CAT[k].l}: ${byCat[k]}" onclick="${onClickAttr}('${k}')"></button>`).join('');
  const leg = CAT_ORDER.filter(k => byCat[k]).map(k =>
    `<button onclick="${onClickAttr}('${k}')"><span class="dot" style="background:${CAT[k].c}"></span>${CAT[k].l} <b>${byCat[k]}</b></button>`).join('');
  return `<div class="seg" role="img" aria-label="Проблеми по категория">${segs}</div><div class="legend">${leg}</div>`;
}
function animateSeg(root = document) {
  requestAnimationFrame(() => requestAnimationFrame(() =>
    root.querySelectorAll('.seg > button').forEach(b => b.style.flexGrow = b.dataset.g)));
}
function filterCat(k) { go('log', { logCat: k, logStatus: 'open', store: null }); }

function streakBar(n) { return `<span class="streak" title="${n} поредни обхода">${'<i></i>'.repeat(Math.min(n, 10))}</span>`; }
function itemsTable(p) {
  const it = p.items || [];
  if (!it.length) return `<p class="muted" style="font-size:14px">${esc(p.details || '')}</p>`;
  const rows = it.slice(0, 40).map(i => {
    const right = i.eur != null ? `${Number(i.eur).toFixed(2)} €${p.category === 'svarshili' ? '<span class="inf">/ден</span>' : ''}` :
      i.streak ? `${streakBar(i.streak)} ${i.streak}×` : '';
    const sub = [i.sku && `код ${i.sku}`, i.qty != null && `${i.qty} бр.`, i.perDay != null && `${i.perDay} бр./ден`,
      i.day && (i.streak ? `от ${i.day}` : i.day), i.doc && `док. ${i.doc}`, i.supplier, i.info].filter(Boolean).map(esc).join(' · ');
    return `<tr><td>${esc(i.label)} ${i.dup ? '<span class="dup">ДУБЛИРАН</span>' : ''}${sub ? `<div class="inf">${sub}</div>` : ''}</td><td class="r">${right}</td></tr>`;
  }).join('');
  return `<table class="items">${rows}</table>${it.length > 40 ? `<p class="muted" style="font-size:13px">и още ${it.length - 40}</p>` : ''}`;
}
function probCard(p, open = false, hideStore = false) {
  const cat = CAT[p.category] || CAT.drugi;
  const ownerOpts = ['<option value="">— без отговорник —</option>'].concat(owners.filter(o => o.aktiven !== false)
    .map(o => `<option ${o.ime === p.owner ? 'selected' : ''}>${esc(o.ime)}</option>`));
  if (p.owner && !owners.some(o => o.ime === p.owner)) ownerOpts.push(`<option selected>${esc(p.owner)}</option>`);
  const closed = ['решено', 'изчезна', 'игнорирай'].includes(p.status);
  return `<details class="prob" id="p-${p._id}" style="--cat:${cat.c}" ${open ? 'open' : ''}>
    <summary>
      <span class="st">${hideStore ? esc(p.typeLabel) : esc(p.store)}</span>
      <span class="pv">${p.eur ? eurF(p.eur, p.eur < 100 ? 2 : 0) + (p.category === 'svarshili' ? '/ден' : '') : ''}</span>
      <span class="tt">${esc(p.title)}</span>
      <span class="meta">
        <span class="badge ${esc(p.priority)}">${p.priority === 'висок' ? '▲ ' : ''}${esc(p.priority)}</span>
        <span class="badge"><span class="dot" style="background:${cat.c}"></span>${esc(p.typeLabel)}</span>
        ${closed ? `<span class="badge ok">✓ ${esc(p.status)}</span>` : p.owner ? `<span class="badge">→ ${esc(p.owner)}</span>` : ''}
        ${(p.seenCount || 1) > 1 ? `<span class="badge">${p.seenCount}-и ден</span>` : '<span class="badge new">нов</span>'}
      </span>
    </summary>
    <div class="in">
      ${itemsTable(p)}
      <div class="grid2">
        <select id="s-${p._id}" aria-label="Статус">${STATUSES.map(s => `<option ${s === p.status ? 'selected' : ''}>${s}</option>`).join('')}</select>
        <select id="o-${p._id}" aria-label="Отговорник">${ownerOpts.join('')}</select>
      </div>
      <textarea id="a-${p._id}" placeholder="Какво се направи или какво трябва да се направи">${esc(p.action || '')}</textarea>
      <div style="display:flex;gap:8px;margin-top:8px;align-items:center">
        <button class="btn" onclick="saveProb('${p._id}')">Запази</button>
        <span class="muted" style="font-size:12.5px">от ${d2(p.firstSeen)} · ${esc(p.source)}</span>
      </div>
      <div style="margin-top:10px">${(p.history || []).slice(-5).reverse().map(h => `<div class="hist">${dt(h.at)} · ${esc(h.by)}: ${esc(h.text)}</div>`).join('')}</div>
    </div>
  </details>`;
}
async function saveProb(id) {
  const p = await api('/api/problems/' + id, { method: 'PATCH', body: JSON.stringify({
    status: $('#s-' + id).value, owner: $('#o-' + id).value, action: $('#a-' + id).value }) });
  const el = document.getElementById('p-' + id); if (el) el.outerHTML = probCard(p, true);
}

/* ============ ДОКЛАД ============ */
async function viewReport() {
  const [r, trend, stores] = await Promise.all([api('/api/report'), api('/api/trend'), api('/api/stores')]);
  if (!r) {
    $('#view').innerHTML = `<div class="hero"><div class="hero-in"><h1 class="title">Сигнали</h1><p>Още няма доклад. Идва сам всяка сутрин в 7:30.</p>
      <button class="btn" style="background:var(--orange)" onclick="runNow(this)">Събери сигналите сега</button></div></div>`;
    return;
  }
  const c = r.counts || {}, s = r.structured || {};
  const prev = trend.length > 1 ? trend[trend.length - 2] : null;
  const byCat = Object.fromEntries(Object.entries(c.byCategory || {}).map(([k, v]) => [k, v.open]));
  const delta = (cur, key, inverse) => {
    if (!prev || prev[key] == null) return '<div class="d">няма сравнение</div>';
    const d = +(cur - prev[key]).toFixed(2);
    if (!d) return '<div class="d">като вчера</div>';
    const bad = inverse ? d < 0 : d > 0;
    return `<div class="d ${bad ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'} ${Math.abs(d).toLocaleString('bg-BG')} спрямо вчера</div>`;
  };
  $('#view').innerHTML = `
  <div class="hero"><div class="hero-in">
    <div class="when"><span>${isoBg(r.date)} · ${c.stores ?? '–'} обекта с проблеми</span><span>обновен ${dt(r.updatedAt).split(', ')[1] || ''}</span></div>
    <h1>${esc(s.headline || r.text)}</h1>
    ${segBar(byCat)}
  </div></div>
  <main>
    <div class="kpis">
      <div class="kpi"><div class="v num" data-to="${c.open || 0}">0</div><div class="l">отворени проблема</div>${delta(c.open || 0, 'open')}</div>
      <div class="kpi crit"><div class="v num" data-to="${c.high || 0}">0</div><div class="l">спешни</div>${delta(c.high || 0, 'high')}</div>
      <div class="kpi"><div class="v num" data-to="${Math.round(c.eurOpen || 0)}" data-suf=" €">0</div><div class="l">в аномалии по наличности</div>${delta(c.eurOpen || 0, 'eurOpen')}</div>
      <div class="kpi"><div class="v num" data-to="${Math.round(c.lostPerDay || 0)}" data-suf=" €">0</div><div class="l">губи на ден от свършили</div>${delta(c.lostPerDay || 0, 'lostPerDay')}</div>
    </div>
    ${(r.warnings || []).length ? `<div class="err">Не всичко се събра: ${r.warnings.map(esc).join(' · ')}</div>` : ''}

    <h2>Спешно днес <small>подредено по пари и риск</small></h2>
    ${(s.urgent || []).map((u, i) => aCard(u, i + 1, 'u')).join('') || '<div class="wait">Няма спешни проблеми.</div>'}

    <h2>Повтарящи се <small>кандидати за правило или отговорник</small></h2>
    ${(s.patterns || []).map((u, i) => aCard(u, null, 'p' + i)).join('') || '<div class="wait">Няма повтарящи се.</div>'}

    ${s.wait ? `<h2>Може да почака</h2><div class="wait">${esc(s.wait)}</div>` : ''}

    <h2>Обекти с най-много проблеми <small>натисни обект</small></h2>
    <div class="panel bars">${storeBars(stores.slice(0, 12))}</div>

    <h2>Тенденция <small>отворени и спешни по дни</small></h2>
    <div class="panel">${trendChart(trend)}</div>

    <div style="display:flex;justify-content:center;margin:22px 0 8px">
      <button class="btn ghost" onclick="runNow(this)">Събери сигналите наново</button>
    </div>
  </main>`;
  document.querySelectorAll('.kpi .v').forEach(countUp);
  animateSeg();
  bindTrend();
}
function aCard(u, rank, key) {
  const cat = CAT[u.category] || CAT.drugi;
  const ids = (u.ids || []).join(',');
  return `<article class="acard" style="--cat:${cat.c}">
    <div class="top">
      ${rank ? `<span class="rank">${rank}</span>` : ''}
      <h3>${esc(u.title)}</h3>
      ${u.eur ? `<span class="eur">${eurF(u.eur)}</span>` : u.count ? `<span class="eur">${u.count} <small>обекта</small></span>` : ''}
    </div>
    <div class="body" style="${rank ? '' : 'padding-left:14px'}">
      <div class="chips"><span class="chip cat" style="--cat:${cat.c}">${cat.l}</span>${(u.stores || []).slice(0, 12).map(st =>
        `<button class="chip" onclick="go('store',{store:'${esc(st).replace(/'/g, "\\'")}'})">${esc(st)}</button>`).join('')}${(u.stores || []).length > 12 ? `<span class="chip">+${u.stores.length - 12}</span>` : ''}</div>
      ${(u.facts || []).length ? `<ul class="facts">${u.facts.map(f => `<li>${esc(f)}</li>`).join('')}</ul>` : ''}
      ${u.why ? `<div class="line"><span>Защо</span><span>${esc(u.why)}</span></div>` : ''}
      ${u.action ? `<div class="line act"><span>Действие</span><span>${esc(u.action)}</span></div>` : ''}
      ${u.who ? `<div class="line"><span>Кой</span><span>${esc(u.who)}</span></div>` : ''}
      ${u.rule ? `<div class="rule"><b>Предложено правило</b>${esc(u.rule)}</div>` : ''}
      ${ids ? `<button class="more" onclick="loadSub(this,'${ids}')">Виж проблемите (${u.ids.length})</button><div class="sub-list"></div>` : ''}
    </div>
  </article>`;
}
async function loadSub(btn, ids) {
  const box = btn.nextElementSibling;
  if (box.innerHTML) { box.innerHTML = ''; btn.textContent = btn.textContent.replace('Скрий', 'Виж'); return; }
  const rows = await api('/api/problems?ids=' + ids);
  box.innerHTML = rows.map(p => probCard(p)).join('');
  btn.textContent = btn.textContent.replace('Виж', 'Скрий');
}
function storeBars(rows) {
  if (!rows.length) return '<div class="empty">Няма отворени проблеми.</div>';
  const max = Math.max(...rows.map(r => r.open));
  return rows.map((r, i) => {
    const segs = CAT_ORDER.filter(k => r.byCategory[k]).map(k =>
      `<span style="background:${CAT[k].c};width:${(r.byCategory[k] / max) * 100}%;animation-delay:${i * 40}ms" title="${CAT[k].l}: ${r.byCategory[k]}"></span>`).join('');
    return `<button class="b" onclick="go('store',{store:'${esc(r.store).replace(/'/g, "\\'")}'})">
      <span class="nm">${esc(r.store)}</span><span class="track">${segs}</span>
      <span class="val">${r.open}${r.high ? ` · <b>${r.high}▲</b>` : ''}</span></button>`;
  }).join('') + `<div class="legend" style="color:var(--ink-2);margin-top:12px">${CAT_ORDER.slice(0, 6).map(k =>
    `<span style="display:inline-flex;gap:6px;align-items:center"><span class="dot" style="background:${CAT[k].c}"></span>${CAT[k].l}</span>`).join('')}</div>`;
}
function trendChart(t) {
  if (t.length < 2) return '<div class="empty">Графиката се появява от втория ден — след още един сутрешен доклад.</div>';
  const W = 640, H = 170, P = { l: 34, r: 10, t: 10, b: 24 };
  const max = Math.max(...t.map(d => d.open || 0)) * 1.1 || 1;
  const x = i => P.l + i * (W - P.l - P.r) / (t.length - 1), y = v => P.t + (1 - v / max) * (H - P.t - P.b);
  const path = k => t.map((d, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(d[k] || 0).toFixed(1)}`).join('');
  const ticks = [0, .5, 1].map(f => Math.round(max * f / 1.1));
  window._trend = { t, x, y, W, H, P };
  return `<div class="ser"><span><i style="background:var(--graphite);height:2px"></i>Отворени</span><span><i style="background:var(--crit)"></i>Спешни</span></div>
  <div class="chart-wrap" id="trendWrap"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Тенденция на отворените и спешните проблеми">
    ${ticks.map(v => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${P.l - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--ink-3)">${v}</text>`).join('')}
    ${t.map((d, i) => (i % Math.ceil(t.length / 7) === 0 || i === t.length - 1) ? `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--ink-3)">${isoBg(d.date).slice(0, 5)}</text>` : '').join('')}
    <path d="${path('open')}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>
    <path d="${path('high')}" fill="none" stroke="var(--crit)" stroke-width="2" stroke-linejoin="round"/>
    <line id="xh" y1="${P.t}" y2="${H - P.b}" stroke="var(--ink-3)" stroke-dasharray="3 3" opacity="0"/>
    <rect x="${P.l}" y="0" width="${W - P.l - P.r}" height="${H}" fill="transparent" id="hit"/>
  </svg><div class="tip" id="tip"></div></div>`;
}
function bindTrend() {
  const hit = document.getElementById('hit'); if (!hit) return;
  const { t, x, W } = window._trend, svg = hit.ownerSVGElement, tip = $('#tip'), xh = $('#xh');
  const move = e => {
    const b = svg.getBoundingClientRect(), px = ((e.touches ? e.touches[0].clientX : e.clientX) - b.left) * W / b.width;
    let i = 0, best = 1e9; t.forEach((_, k) => { const d = Math.abs(x(k) - px); if (d < best) { best = d; i = k; } });
    const d = t[i]; xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i)); xh.setAttribute('opacity', 1);
    tip.innerHTML = `${isoBg(d.date)}<br>отворени <b>${d.open}</b> · спешни <b>${d.high}</b>`;
    tip.style.left = (x(i) / W * b.width) + 'px'; tip.style.top = '20px'; tip.style.opacity = 1;
  };
  hit.addEventListener('mousemove', move); hit.addEventListener('touchstart', move, { passive: true }); hit.addEventListener('touchmove', move, { passive: true });
  hit.addEventListener('mouseleave', () => { tip.style.opacity = 0; xh.setAttribute('opacity', 0); });
}
async function runNow(btn) {
  btn.disabled = true; btn.textContent = 'Събирам… (до 2 минути)';
  const r = await api('/api/run', { method: 'POST' });
  if (r.busy) alert('Вече се събира. Опитай пак след малко.');
  go('report');
}

/* ============ ОБЕКТИ ============ */
async function viewStores() {
  const stores = await api('/api/stores');
  const totalByCat = {}; stores.forEach(s => Object.entries(s.byCategory).forEach(([k, v]) => totalByCat[k] = (totalByCat[k] || 0) + v));
  $('#view').innerHTML = `<div class="hero"><div class="hero-in">
      <div class="when"><span>${stores.length} обекта с отворени проблеми</span></div>
      <h1 class="title">Обекти</h1>${segBar(totalByCat)}</div></div>
    <main><input class="search" placeholder="Търси обект" oninput="filterStores(this.value)" aria-label="Търси обект">
    <div class="panel bars" id="storeBars">${storeBars(stores)}</div></main>`;
  window._stores = stores; animateSeg();
}
function filterStores(q) {
  q = q.trim().toUpperCase();
  $('#storeBars').innerHTML = storeBars(window._stores.filter(s => s.store.includes(q)));
}
async function viewStore() {
  const rows = await api('/api/problems?status=open&store=' + encodeURIComponent(state.store));
  const byCat = {}; rows.forEach(p => byCat[p.category] = (byCat[p.category] || 0) + 1);
  const high = rows.filter(p => p.priority === 'висок').length;
  const eur = rows.filter(p => p.category !== 'svarshili').reduce((s, p) => s + (p.eur || 0), 0);
  const lost = rows.filter(p => p.category === 'svarshili').reduce((s, p) => s + (p.eur || 0), 0);
  $('#view').innerHTML = `<div class="hero"><div class="hero-in">
      <button class="back" onclick="go('stores')">‹ Всички обекти</button>
      <h1 class="title">${esc(state.store)}</h1>${segBar(byCat, 'noop')}</div></div>
    <main>
      <div class="kpis">
        <div class="kpi"><div class="v num" data-to="${rows.length}">0</div><div class="l">отворени</div></div>
        <div class="kpi crit"><div class="v num" data-to="${high}">0</div><div class="l">спешни</div></div>
        <div class="kpi"><div class="v num" data-to="${Math.round(eur)}" data-suf=" €">0</div><div class="l">в аномалии</div></div>
        <div class="kpi"><div class="v num" data-to="${Math.round(lost)}" data-suf=" €">0</div><div class="l">губи на ден</div></div>
      </div>
      ${CAT_ORDER.filter(k => byCat[k]).map(k => `<h2><span class="dot" style="background:${CAT[k].c}"></span>${CAT[k].l} <small>${byCat[k]}</small></h2>` +
        rows.filter(p => p.category === k).map(p => probCard(p, rows.length <= 4, true)).join('')).join('') || '<div class="empty">Няма отворени проблеми за този обект.</div>'}
    </main>`;
  document.querySelectorAll('.kpi .v').forEach(countUp); animateSeg();
}
function noop() {}

/* ============ ДНЕВНИК ============ */
let tq;
async function viewLog() {
  const q = new URLSearchParams();
  if (state.logStatus) q.set('status', state.logStatus);
  if (state.logCat) q.set('category', state.logCat);
  if (state.logQ) q.set('q', state.logQ);
  const rows = await api('/api/problems?' + q);
  const chip = (k, l, dot) => `<button class="${state.logCat === k ? 'on' : ''}" onclick="go('log',{logCat:'${k}'})">${dot ? `<span class="dot" style="background:${dot}"></span>` : ''}${l}</button>`;
  $('#view').innerHTML = `<div class="hero"><div class="hero-in"><div class="when"><span>${rows.length} записа</span></div><h1 class="title">Дневник</h1></div></div>
    <main>
      <div class="filters">${chip('', 'Всички')}${CAT_ORDER.slice(0, 6).map(k => chip(k, CAT[k].l, CAT[k].c)).join('')}</div>
      <div class="filters">${[['open', 'Отворени'], ['', 'Всички статуси'], ['възложено', 'Възложени'], ['в работа', 'В работа'], ['решено', 'Решени'], ['изчезна', 'Изчезнали']]
        .map(([v, l]) => `<button class="${state.logStatus === v ? 'on' : ''}" onclick="go('log',{logStatus:'${v}'})">${l}</button>`).join('')}</div>
      <input class="search" placeholder="Търси обект, артикул или текст" value="${esc(state.logQ)}" oninput="clearTimeout(tq);tq=setTimeout(()=>{state.logQ=this.value;viewLog()},350)" aria-label="Търси">
      <div>${rows.map(p => probCard(p)).join('') || '<div class="empty">Няма записи по този филтър.</div>'}</div>
    </main>`;
  const s = $('.search'); if (state.logQ && s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
}

/* ============ ХОРА ============ */
async function viewOwners() {
  owners = await api('/api/owners');
  $('#view').innerHTML = `<div class="hero"><div class="hero-in"><h1 class="title">Отговорници</h1>
      <div class="when"><span>На тях се възлагат проблемите. По-късно ще получават уведомления автоматично.</span></div></div></div>
    <main>
      <div class="panel" style="margin-top:14px">
        <div class="grid2"><input id="nIme" placeholder="Име"><input id="nTel" placeholder="Телефон"></div>
        <div class="grid2"><input id="nRol" placeholder="Роля, напр. Заявки НДК"><input id="nObl" placeholder="За какво отговаря"></div>
        <button class="btn" onclick="addOwner()">Добави отговорник</button>
      </div>
      ${owners.map(o => `<div class="panel" style="margin-top:10px;display:flex;justify-content:space-between;gap:10px;align-items:center">
        <div><b>${esc(o.ime)}</b> <span class="muted">${esc(o.rolia || '')}</span><div class="muted" style="font-size:13px">${esc(o.telefon || '')} ${o.oblasti ? '· ' + esc(o.oblasti) : ''}</div></div>
        <button class="btn ghost" onclick="delOwner('${o._id}')">Премахни</button></div>`).join('')}

}
async function addOwner() {
  if (!$('#nIme').value.trim()) return;
  await api('/api/owners', { method: 'POST', body: JSON.stringify({ ime: $('#nIme').value.trim(), telefon: $('#nTel').value.trim(), rolia: $('#nRol').value.trim(), oblasti: $('#nObl').value.trim() }) });

async function delOwner(id) { if (confirm('Да премахна ли отговорника?')) { await api('/api/owners/' + id, { method: 'DELETE' }); viewOwners(); } }

      <h2>Повтарят се най-много</h2>
      <div class="panel">${s.repeating.length ? s.repeating.map(r => `<div class="line" style="grid-template-columns:1fr auto"><span style="color:var(--ink)"><b>${esc(r.store)}</b> · ${esc(r.title)} <span class="muted">(${esc(r.type)})</span></span><b>${r.seen} дни</b></div>`).join('') : '<div class="muted">Още няма — нужни са поне 3 дни.</div>'}</div>
